<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        try {
            const root = document.documentElement;
            const theme = localStorage.getItem('theme');
            const language = localStorage.getItem('language');

            root.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
            root.setAttribute('lang', language === 'ar' ? 'ar' : 'en');
            root.setAttribute('dir', language === 'ar' ? 'rtl' : 'ltr');
            root.setAttribute('data-app-ready', 'false');
        } catch (error) {}
    </script>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/css-variables.css">
    <link rel="stylesheet" href="css/style.css">

    <link rel="manifest" href="assets/manifest.json">
    <meta name="theme-color" content="#6C5CE7">

    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <link rel="icon" type="image/png" href="assets/icons/icon-192-re.png">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">

    <title>Listly</title>
</head>
<body>
    <div id="app">

        <header>
            <h2 data-i18n="app.title">Checklist</h2>
            <span>
                <input id="input-add" type="text" placeholder="Add new task" data-i18n-placeholder="input.placeholder">
                <button id="button-add" aria-label="Add task" data-i18n-aria-label="input.add">
                    <img src="assets/icons/plus.png" alt="">
                </button>
            </span>
        </header>

        <main>
            <div class="scroll-container">
                <div id="empty-state">
                    <p data-i18n="empty.state">No tasks</p>
                </div>

                <ul id="todo-list">
                    <template id="task-template">
                        <li class="task">
                            <input type="checkbox" class="task-checkbox">
                            <label class="task-text"></label>
                            <button type="button" class="delete-btn" title="Delete task" data-i18n-title="task.delete">
                                <img src="assets/icons/remove.svg" alt="">
                            </button>
                        </li>
                    </template>
                </ul>
            </div>
        </main>

        <footer>
            <button id="clear-completed" data-i18n="footer.clear">Clear Completed</button>

            <button id="settings-btn" aria-label="Settings" title="Settings"
                    data-i18n-aria-label="settings.open" data-i18n-title="settings.open">
                <img src="assets/icons/setting.png" alt="">
            </button>

            <p>
                <span id="tasks-count">0</span>
                <span id="tasks-left-label" data-i18n-plural="footer.tasksLeft">tasks left</span>
            </p>
        </footer>

    </div>

    <dialog id="settings-dialog" aria-labelledby="settings-title">
        <form id="settings-form" method="dialog">

            <h2 id="settings-title" class="visually-hidden" data-i18n="settings.title">Settings</h2>

            <section id="settings-lang" class="settings-step" data-step="language">
                <h3 data-i18n="settings.language.title">Choose language</h3>

                <fieldset class="settings-options">
                    <legend class="visually-hidden" data-i18n="settings.language.legend">Language</legend>

                    <label class="option-card">
                        <input type="radio" name="language" value="en" checked>
                            <span data-i18n="settings.language.english">English</span>
                    </label>

                    <label class="option-card">
                        <input type="radio" name="language" value="ar">
                            <span data-i18n="settings.language.arabic">Arabic</span>
                    </label>
                </fieldset>
            </section>

            <section class="settings-step" data-step="theme">
                <h3 data-i18n="settings.theme.title">Choose appearance</h3>

                <fieldset id="settings-theme" class="settings-options">
                    <legend class="visually-hidden" data-i18n="settings.theme.legend">Appearance</legend>

                    <label class="option-card">
                        <input type="radio" name="theme" value="light" checked>
                        <span data-i18n="settings.theme.light">Light</span>
                    </label>

                    <label class="option-card">
                        <input type="radio" name="theme" value="dark">
                        <span data-i18n="settings.theme.dark">Dark</span>
                    </label>
                </fieldset>
            </section>

            <div class="settings-actions">
                <button type="submit" id="button-settings-finish" data-i18n="settings.finish">Finish</button>
            </div>

        </form>
    </dialog>

    <script type="module" src="js/main.js"></script>
</body>
</html>
